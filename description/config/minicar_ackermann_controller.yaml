/**/controller_manager:
  ros__parameters:
    update_rate: 100

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/ackermann_steering_controller:
  ros__parameters:
    wheelbase: 0.257
    front_wheel_track: 0.19
    rear_wheel_track: 0.19
    front_wheels_radius: 0.032
    rear_wheels_radius: 0.032

    # Humble uses rear_wheels_names/front_wheels_names instead of traction_joints_names/steering_joints_names
    rear_wheels_names: ["rear_left_wheel_joint", "rear_right_wheel_joint"]
    front_wheels_names: ["front_left_steering_joint", "front_right_steering_joint"]

    base_frame_id: base_footprint
    odom_frame_id: odom

    enable_odom_tf: true
    open_loop: true
    publish_rate: 50.0

    # Odometry
    position_feedback: false
    use_stamped_vel: false
